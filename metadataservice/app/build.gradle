// LOCAL BUILD: Removed Asciidoctor import - not needed for local builds
// import org.asciidoctor.gradle.jvm.pdf.AsciidoctorPdfTask
import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
    id 'kotlin-android'
    // Removed: id "de.esolutions.media-common"
    id 'kotlin-parcelize'
    // LOCAL BUILD: Removed maven-publish - not needed for local builds
}

def versionsJsonFile = new File("$projectDir/../deploy/versions.json")
def json = new JsonSlurper().parseText(versionsJsonFile.text)
def identityProp = project.findProperty("mds.identity")?.toString()?.toLowerCase()
def mdsIdentity = identityProp ?: "new"
def validIdentities = ["new"]
if (!(mdsIdentity in validIdentities)) {
    throw new GradleException("Unsupported mds.identity='${mdsIdentity}'. This branch supports only: new.")
}

def newApplicationId = "technology.cariad.entertainment.metadataservice"
def legacyApplicationId = "de.esolutions.metadataservice"

def appApplicationId = newApplicationId
def useServicePermission = "${appApplicationId}.USE_SERVICE"
def legacyUseServicePermission = "${legacyApplicationId}.USE_SERVICE"
def aidlBindAction = "technology.cariad.entertainment.metadataserviceclient.api.IMetadataServiceAidl"
def legacyAidlBindAction = "de.esolutions.metadataserviceclient.api.IMetadataServiceAidl"
def imageProviderAuthority = "technology.cariad.entertainment.metadataservice.contentprovider.MetadataImageProvider"
def legacyImageProviderAuthority = "${legacyApplicationId}.MetadataService.ImageProvider"
def manifestImageProviderAuthorities = "${imageProviderAuthority};${legacyImageProviderAuthority}"
def appClassName = "technology.cariad.entertainment.metadataservice.MetadataServiceApp"
def serviceClassName = "technology.cariad.entertainment.metadataservice.service.MetadataService"
def providerClassName = "technology.cariad.entertainment.metadataservice.contentprovider.MetadataImageProvider"

def appVersion = json[appApplicationId] as String
if (!appVersion) {
    throw new GradleException("No version entry found in deploy/versions.json for '${appApplicationId}'.")
}

// Parse version string: "1.90-release" -> major=1, minor=90, patch=0, cluster=release
def versionParts = appVersion.split("-")
def clusterInfo = versionParts.length > 1 ? versionParts[1] : "release"
def numericVersion = versionParts[0].split("\\.")

def versionMajor = Integer.parseInt(numericVersion[0])
def versionMinor = Integer.parseInt(numericVersion.length > 1 ? numericVersion[1] : "0")
def versionPatch = Integer.parseInt(numericVersion.length > 2 ? numericVersion[2] : "0")
def buildTimestamp = new Date().format("yyyyMMddHHmmss")

def appVersionName = "$versionMajor.$versionMinor.$versionPatch-$clusterInfo"
def appVersionCode = versionMajor * 10000 + versionMinor * 100 + versionPatch
// Runtime profile selection.
//   emu          : vanilla Android Automotive emulator. Conradlib, approval
//                  endpoint, mock service list + disable reasons, baked-in test token,
//                  DEV mode ON. Runs out of the box.
//   icc          : real testbench with Magic running. Conradlib, real token,
//                  real service list + disable reasons, LIVE mode.
//   no-gn        : VW no-license fallback. Same runtime behavior as icc but
//                  Gracenote license is explicitly disabled and runtime token
//                  retrieval remains the default path.
def mdsProfileProp = project.findProperty("mds.profile")?.toString()?.toLowerCase()
def mdsProfile = mdsProfileProp ?: "icc"
def validProfiles = ["emu", "icc", "no-gn"]
if (!(mdsProfile in validProfiles)) {
    throw new GradleException("Unsupported mds.profile='${mdsProfile}'. Use one of: ${validProfiles.join(', ')}.")
}
def conradlibVariant = "default"

def profileLabel
def archivesIdentityLabel = "tech-cariad"
def defaultConradBackendUrl
def defaultDevMode
def defaultTokenOverrideEnabled
def defaultUseRealServiceList
def defaultUseRealDisableReasons
def defaultConradTokenFile
def conradTokenFile = new File("$projectDir/../../token/testtoken.txt")
def envGnLicenseVariant = System.env['GN_LICENSE_VARIANT']?.trim()
def gnLicenseVariant = envGnLicenseVariant ?: "VARIANT_OEM_AU"
switch (mdsProfile) {
    case "emu":
        profileLabel = "EmuGeneric"
        defaultConradBackendUrl = "https://connectedradio-v2.approval.car-cloud.org/"
        defaultDevMode = true
        defaultTokenOverrideEnabled = true
        defaultUseRealServiceList = false
        defaultUseRealDisableReasons = false
        defaultConradTokenFile = conradTokenFile
        break
    case "icc":
        profileLabel = "ICC"
        defaultConradBackendUrl = "https://connectedradio-v2.approval.car-cloud.org/"
        defaultDevMode = false
        defaultTokenOverrideEnabled = false
        defaultUseRealServiceList = true
        defaultUseRealDisableReasons = true
        defaultConradTokenFile = conradTokenFile
        break
    default: // no-gn
        profileLabel = "NoGN"
        defaultConradBackendUrl = "https://connectedradio-v2.approval.car-cloud.org/"
        defaultDevMode = false
        defaultTokenOverrideEnabled = false
        defaultUseRealServiceList = true
        defaultUseRealDisableReasons = true
        defaultConradTokenFile = conradTokenFile
        gnLicenseVariant = "NONE"
        break
}
if (mdsProfile != "no-gn" && gnLicenseVariant == "NONE") {
    throw new GradleException("GN_LICENSE_VARIANT=NONE requires -Pmds.profile=no-gn. Current profile is '${mdsProfile}'.")
}
    if (!defaultConradTokenFile.exists()) {
        throw new RuntimeException("Missing default conrad token file: ${defaultConradTokenFile}")
    }
    def defaultConradToken = defaultConradTokenFile.text.trim()
def quoteBuildConfigString = { value ->
    def escaped = value.replace("\\", "\\\\").replace("\"", "\\\"")
    return "\"${escaped}\""
}

def gnsdkArm64LibDir = file("$projectDir/../../gnsdk-auto-2.6.19.14264-20250729/lib/android_arm64-v8a")
def gnsdkX8664LibDir = file("$projectDir/../../gnsdk-auto-2.6.19.14264-20250729/lib/android_x86_64")
def generatedGnsdkJniLibsDir = file("$buildDir/generated/gnsdkJniLibs")

def aidlPath = "../../esoSDK/aosp-artifacts/aidls"

ext {
    dagger_version = '2.49'
    room_version = '2.8.4'
    lifecycle_version = '2.5.1'
}

android {
    namespace 'technology.cariad.entertainment.metadataservice'
    android.ndkVersion "$ndk_version"
    compileSdk 37
    useLibrary 'android.car'
    defaultConfig {
        applicationId appApplicationId
        minSdkVersion 33
        targetSdkVersion 37
        versionCode = appVersionCode
        versionName = appVersionName
        setProperty("archivesBaseName", "MetadataService-${profileLabel}-${archivesIdentityLabel}")
        manifestPlaceholders = [
            mdsUseServicePermission: useServicePermission,
            mdsLegacyUseServicePermission: legacyUseServicePermission,
            mdsAidlAction: aidlBindAction,
            mdsLegacyAidlAction: legacyAidlBindAction,
            mdsProviderAuthority: manifestImageProviderAuthorities,
            mdsApplicationClass: appClassName,
            mdsServiceClass: serviceClassName,
            mdsProviderClass: providerClassName
        ]

        def gnLicenseEnabled = gnLicenseVariant != "NONE"
        buildConfigField "boolean", "GN_LICENSE_ENABLED", "${gnLicenseEnabled}"
        buildConfigField "String", "MDS_IDENTITY", quoteBuildConfigString(mdsIdentity)
        buildConfigField "String", "USE_SERVICE_PERMISSION", quoteBuildConfigString(useServicePermission)
        buildConfigField "String", "LEGACY_USE_SERVICE_PERMISSION", quoteBuildConfigString(legacyUseServicePermission)
        buildConfigField "String", "METADATA_SERVICE_AIDL_ACTION", quoteBuildConfigString(aidlBindAction)
        buildConfigField "String", "LEGACY_METADATA_SERVICE_AIDL_ACTION", quoteBuildConfigString(legacyAidlBindAction)
        buildConfigField "String", "IMAGE_PROVIDER_AUTHORITY", quoteBuildConfigString(imageProviderAuthority)
        buildConfigField "String", "LEGACY_IMAGE_PROVIDER_AUTHORITY", quoteBuildConfigString(legacyImageProviderAuthority)
        buildConfigField "String", "MDS_PROFILE", "\"${mdsProfile}\""
        buildConfigField "String", "CONRADLIB_VARIANT", "\"${conradlibVariant}\""
        buildConfigField "String", "BUILD_TIMESTAMP", quoteBuildConfigString(buildTimestamp)
        buildConfigField "String", "DEFAULT_CONRAD_BACKEND_URL", quoteBuildConfigString(defaultConradBackendUrl)
        buildConfigField "String", "DEFAULT_CONRAD_TOKEN", quoteBuildConfigString(defaultConradToken)
        buildConfigField "boolean", "DEFAULT_DEV_MODE", "${defaultDevMode}"
        buildConfigField "boolean", "DEFAULT_TOKEN_OVERRIDE_ENABLED", "${defaultTokenOverrideEnabled}"
        buildConfigField "boolean", "DEFAULT_USE_REAL_SERVICE_LIST", "${defaultUseRealServiceList}"
        buildConfigField "boolean", "DEFAULT_USE_REAL_DISABLE_REASONS", "${defaultUseRealDisableReasons}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.incremental": "true"]

                if (!project.hasProperty("TARGET_NAME")) {
                    arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
                }
            }
        }

        // include framework dependencies
        testOptions {
            unitTests.includeAndroidResources = true
        }

        compileOptions {
            sourceCompatibility JavaVersion.VERSION_1_8
            targetCompatibility JavaVersion.VERSION_1_8

            kotlinOptions.freeCompilerArgs += [
                    "-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi"
            ]
        }

        kotlinOptions {
            jvmTarget = "1.8"
        }

        buildFeatures {
            buildConfig = true
            aidl = true
        }

        // Native build configuration for Gracenote SDK (standalone without Conan)
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++14 -Wall" +
                        " -Werror=address" +
                        " -Werror=array-bounds" +
                        " -Werror=uninitialized" +
                        " -Werror=format" +
                        " -Werror=format-security" +
                        " -Werror=format-nonliteral" +
                        " -Werror=undef" +
                        " -ffunction-sections" +
                        " -fdata-sections" +
                        " -fstack-protector-strong" +
                        " -Wa,--noexecstack" +
                        " -O2" +
                        " -D_FORTIFY_SOURCE=2" +
                        " -Wall" +
                        " -Wextra" +
                        " -Werror" +
                        " -Werror=address-of-temporary" +
                        " -Werror=date-time" +
                        " -Werror=int-to-pointer-cast" +
                        " -Werror=null-dereference" +
                        " -Werror=uninitialized" +
                        " -Werror=return-type" +
                        " -Werror=sequence-point" +
                        " -Wcast-align" +
                        " -Wfor-loop-analysis" +
                        " -Wimplicit-fallthrough" +
                        " -Woverlength-strings" +
                        " -Wpointer-arith" +
                        " -Wno-unused" +
                        " -Wno-unused-parameter" +
                        " -Wno-error=deprecated-declarations" +
                        " -Wno-error=unused-command-line-argument" +
                        " -Wdelete-non-virtual-dtor" +
                        " -Werror=non-virtual-dtor" +
                        " -Wsign-promo" +
                        " -Wno-error=defaulted-function-deleted" +
                        " -Wno-inconsistent-missing-override" +
                        " -Wno-error=#warnings" +
                        " -Wno-error=deprecated-copy-with-user-provided-copy" +
                        " -Wno-error=missing-field-initializers" +
                        " -Wl,-z,relro" +
                        " -Wl,-z,now" +
                        " -Wl,-z,noexecstack" +
                        " -fPIC"

                // add flag to set gracenote license for different oems, the env variables are defined
                // in buildruns.yml and set by the build scripts
                if (gnLicenseVariant != "NONE") {
                    cppFlags += " -D" + gnLicenseVariant
                }

                cFlags "-Werror=implicit-function-declaration" +
                        " -Werror=int-conversion" +
                        " -Werror=pointer-to-int-cast"

                arguments "-DANDROID_STL=c++_shared"
            }
        }

        ndk {
            // Build both arm64 and x86_64 so emulator can load native Gracenote JNI.
            abiFilters 'arm64-v8a', 'x86_64'
        }

        lintOptions {
            abortOnError false
        }
    }

    // LOCAL BUILD: Disabled ABI splits (no native build)
    /*
    splits {
        abi {
            enable true
            reset()
            include "x86_64", "arm64-v8a"
            universalApk true
        }
    }
    */

    testOptions {
        unitTests.all {
            ignoreFailures = true
            jacoco {
                includeNoLocationClasses = true
                excludes = ['*']
            }
            jvmArgs = ["--add-opens=java.base/java.util=ALL-UNNAMED"]
        }
    }

    sourceSets {
        main {
            aidl.srcDirs += "$aidlPath/aidl.navigation/navigation.positioninformation/aidl"
            jniLibs.srcDirs += generatedGnsdkJniLibsDir
        }
        androidTest {
            java.srcDirs += "$projectDir/src/testShared/java"
            aidl.srcDirs += main.aidl.srcDirs
        }
        test {
            java.srcDirs += "$projectDir/src/testShared/java"
            aidl.srcDirs += main.aidl.srcDirs
        }

    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro',
                    'proguard-rules-release.pro'
        }

        debug {
            minifyEnabled false
            shrinkResources false
            debuggable true
            testCoverageEnabled = true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro',
                    'proguard-rules-debug.pro'
        }
    }

    flavorDimensions = ["release", "region"]
    productFlavors {
        create("dev") {
            setDimension("release")
        }

        create("prod") {
            isDefault = true
            setDimension("release")
        }

        create("row") {
            isDefault = true
            setDimension("region")
        }

        create("cn") {
            setDimension("region")
        }
    }

    // Native build configuration (standalone without Conan)
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'

            if (project.hasProperty("NATIVE_OUTPUT")) {
                version "3.28.5"
                buildStagingDirectory project.properties["NATIVE_OUTPUT"]
            }
        }
    }

    productFlavors {
        dev {
            buildFeatures {
                viewBinding = true
            }
            // Dev builds ("Devstände") are always signed with the testkey,
            // regardless of build type.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        // exclude from fw libraries
        exclude 'META-INF/INDEX.LIST'
        exclude 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
        pickFirst "**/*.so"
    }

    signingConfigs {
        debug {
            storeFile file('../keystore/testkey.keystore')
            storePassword 'android'
            keyPassword 'android'
            keyAlias 'testkey'
        }
    }
}

tasks.register("syncGnsdkArm64JniLibs", Copy) {
    from(gnsdkArm64LibDir) {
        include "*.so"
    }
    into new File(generatedGnsdkJniLibsDir, "arm64-v8a")
}

tasks.register("syncGnsdkX8664JniLibs", Copy) {
    from(gnsdkX8664LibDir) {
        include "*.so"
    }
    into new File(generatedGnsdkJniLibsDir, "x86_64")
}

tasks.named("preBuild") {
    dependsOn("syncGnsdkArm64JniLibs")
    dependsOn("syncGnsdkX8664JniLibs")
}

// transitive dependency override for OSS compliance
configurations.configureEach {
    resolutionStrategy {
        force 'org.reactivestreams:reactive-streams:1.0.4'
    }
}

