task cppLint(type: Exec) {
    group 'verification'
    description 'run cpplint over all native c++ code in GracenoteService'

    workingDir "src/main/cpp/gracenoteservice"

    commandLine("python", "../../spice/cpplint/cpplint.py",
            "--filter=-whitespace,-runtime/reference",
            "--linelength=120",
            "--repository=.", "--recursive",
            ".")

    ignoreExitValue true

    ext.lintfile = new File('../spice/cpplint/codestyle.log')
    standardOutput = new ByteArrayOutputStream();
    errorOutput = new ByteArrayOutputStream()

    doLast {
        lintfile.text = errorOutput.toString() + standardOutput.toString()
    }
}

// LOCAL BUILD: Removed publishing block - not needed for local builds and referenced eso.local Artifactory

// LOCAL BUILD: Removed createUserManualPdf task - requires Asciidoctor plugin not available for local builds
// task createUserManualPdf(type: AsciidoctorPdfTask, description: "create pdf from the asciidoc") { ... }

// LOCAL BUILD: Removed all Conan-related tasks (fetchConanCerts, installConanProfiles, remoteConanClean, remoteConanAdd, remoteConanUser, fetchConanDependencies)
// These are not needed for local builds without eso.local access

// LOCAL BUILD: Removed oss {} and sbomConfig {} blocks
// These require the media-common-gradle-plugin which is not available for local builds
