rootProject.name='mds_metadataservice'

dependencyResolutionManagement {
    repositoriesMode.set(org.gradle.api.initialization.resolve.RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven {
            name = 'RadioPlayerGitHubPackages'
            url = uri('https://maven.pkg.github.com/Radioplayer/radioplayer-automotive-sdk-core')
            credentials {
                username = 'rp-automotive-sandbox'
                password = new File("${rootDir}/../token/rpsdktoken.txt").text.trim()
            }
        }
    }
}

include ':app'
include ':conradlib'

def mdsProfile = (gradle.startParameter.projectProperties['mds.profile'] ?: '').toLowerCase()
def conradlibVariant
if (mdsProfile) {
	if (mdsProfile == 'emu' || mdsProfile == 'icc' || mdsProfile == 'no-gn') {
		conradlibVariant = 'default'
	} else {
		throw new RuntimeException("Unsupported mds.profile='$mdsProfile'. Use 'emu', 'icc' or 'no-gn'.")
	}
} else {
	conradlibVariant = (gradle.startParameter.projectProperties['conradlib.variant'] ?: 'default').toLowerCase()
}
def conradlibProjectDir

if (conradlibVariant == 'default') {
	conradlibProjectDir = '../metadataservice_conradlib/ConnectedRadioClient/app'
} else {
	throw new RuntimeException("Unsupported conradlib.variant='$conradlibVariant'. Use 'default'.")
}

project(':conradlib').projectDir = new File(conradlibProjectDir)

include ':clientinterface'
// Build metadataservice client interface from source instead of using metadataservice.aar
project(':clientinterface').projectDir = new File('../metadataservice_clientinterface/lib')
